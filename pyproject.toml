[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nft-press-release-faq-generator"
version = "1.0.1"
description = "NFT Press Release FAQ Generator: Search 50 NFT press release FAQs from BuyCryptoPressRelease.com NFT Project PR in plain English. Get the best answer with a 0 to 100 confidence score, and generate the FAQ as Markdown, JSON, FAQPage schema or HTML."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "BuyCryptoPressRelease.com", email = "mojo@wewinconsultants.com" }]
keywords = ["nft press release", "nft pr", "nft project pr", "nft mint announcement", "nft collection launch", "web3 press release", "crypto press release", "faq generator", "faq schema"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Office/Business",
]

[project.urls]
Homepage = "https://buycryptopressrelease.com/"
Repository = "https://github.com/buycryptopressrelease/nft-press-release-faq-generator"
Documentation = "https://nft-press-release-faq-generator.readthedocs.io"
NPM = "https://www.npmjs.com/package/nft-press-release-faq-generator"
"Hugging Face" = "https://huggingface.co/datasets/buycryptopressrelease/nft-press-release-faq-dataset"

[project.scripts]
nftpr-faq = "nft_pr_faq:main"

[tool.setuptools]
py-modules = ["nft_pr_faq"]
